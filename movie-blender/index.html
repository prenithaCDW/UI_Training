<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Movies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer type="module" src="./script.js"></script>
</head>

<body>
    <!-- heading area -->
    <header class="heading-container">
        <h3 class="heading">Blender Movies</h3>
        <span class="profile-container">
            <p class="profile-name">Steffy Jerry</p>
            <figure class="profile-image">
                <img src="./images/profile.jpeg" alt="Steffy Jerry" class="image-area">
            </figure>
        </span>
    </header>
    <main class="content-container">
        <!-- movies -->
        <section class="movies-container">
            <div class="video-wrapper">
                <video class="video-container" poster="./images/thumbnail.png"></video>
                <button class="play-btn">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>
            <h4 class="movie-title"></h4>
            <p class="movie-description"></p>
            <div class="comments-container">
                <p class="comment-title">Comments</p>
                <!--<div class="comment-content">
                    <img class="comment-image">
                    <div class="content">
                        <h5 class="comment-name"></h5>
                        <p class="comment"></p> 
                    <div>
                </div> -->
            </div>
        </section>
        <!-- posters -->
        <section class="posters-container">
            <p class="posters-title">Upcoming Projects</p>
            <!-- <figure class="posters-card">
                <img class="posters-image">
            </figure> -->
        </section>
    </main>
    <footer class="footer-container">
        <p class="copyright"> <span>©</span> Copyrights 2022</p>
        <p class="name">Blender Movies</p>
    </footer>
    <span class="chat-icon">
        <i class="fas fa-comment-alt"></i>
    </span>
</body>

</html>
