<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Cards</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>
<body>

  <!-- PARTICLES -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- BLOBS -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- CARDS -->
  <section class="container">

    <article class="card">
      <h2 class="title">Developer</h2>
      <p class="content">Builds modern web apps using clean code and creativity.</p>
    </article>

    <article class="card">
      <h2 class="title">Designer</h2>
      <p class="content">Creates beautiful UI/UX with attention to detail.</p>
    </article>

    <article class="card">
      <h2 class="title">Freelancer</h2>
      <p class="content">Works with clients worldwide delivering quality projects.</p>
    </article>

    <article class="card">
      <h2 class="title">Learner</h2>
      <p class="content">Always exploring new technologies and improving skills.</p>
    </article>
  </section>

</body>
</html>
