<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Hats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="./assets/favicon.ico">
</head>

<body>
    <!-- menu -->
    <section class="menu">
        <div class="menu-icon">
            <i class="fa-solid fa-2xl fa-bars"></i>
        </div>
        <!-- list of items -->
        <nav class="navbar">
            <ul>
                <li class="image-item">
                    <img src="./assets/hat-icon.svg " alt="hat" class="image-hat">
                </li>
                <li class="item">COWBOY HATS</li>
                <li class="item">DAD HATS</li>
                <li class="item">FEDORAS</li>
                <li class="item">TRIBAL HATS</li>
                <li class="item">FLAT CAPS</li>
                <li class="item">DERBY HATS</li>
                <li class="item">ARMY CAPS</li>
                <li class="item">CLOCHE HATS</li>
                <li class="item">BEANIES</li>
                <li class="item">TRAPPER HATS</li>
                <li class="item">SNAPBACKS</li>
                <li class="item">TRUCKER HATS</li>
                <li class="item">VISORS</li>
            </ul>
        </nav>
    </section>
    <!-- main -->
    <main class="content">
        <h3 class="sub-title">FANCY HATS</h3>
        <p class="time">SINCE<span class="year">1867</span></p>
        <h1 class="title">HATS FOR A <span class="bold-title">LIFETIME</span></h1>
    </main>
    <!-- footer contains social media icons -->
    <footer class="socials">
        <a href="https://twitter.com" class="twitter">
            <i class="fa-brands fa-twitter socials-icon"></i>
        </a>
        <a href="https://facebook.com" class="facebook">
            <i class="fa-brands fa-facebook socials-icon"></i>
        </a>
    </footer>
</body>

</html>
