<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
</head>

<body>
    <main class="page-container">
        <!-- logo -->
        <figure class="brand-logo">
            <img src="./logo.svg" alt="sirius" class="brand-image">
        </figure>

        <!-- form -->
        <form class="checkout-form">
            <!-- billing section -->
            <section class="form-section">
                <h2 class="section-title-billing">BILLING DETAILS</h2>
                <div class="double-input-row">
                    <div class="form-group">
                        <label class="input-label" for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName"  class="text-input" />
                        <p class="input-error"></p>
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" class="text-input" />
                        <p class="input-error"></p>
                    </div>
                </div>

                <div class="form-group">
                    <label class="input-label" for="email">Email Address</label>
                    <input type="text" id="email" name="email" class="text-input" />
                    <p class="input-error"></p>
                </div>

                <div class="form-group">
                    <label class="input-label" for="contactNumber">Contact Number</label>
                    <input type="text" id="contactNumber" name="contactNumber" class="text-input" />
                    <p class="input-error"></p>
                </div>

                <div class="form-group">
                    <label class="input-label" for="pinCode">PIN Code</label>
                    <input type="text" id="pinCode" name="pinCode" class="text-input" />
                    <p class="input-error"></p>
                </div>
            </section>

            <!-- payment section -->
            <section class="form-section">
                <h2 class="section-title">PAYMENT DETAILS</h2>

                <div class="form-group">
                    <label class="input-label" for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" name="cardNumber" class="text-input" />
                    <p class="input-error"></p>
                </div>

                <div class="double-input-row">
                    <div class="form-group">
                        <label class="input-label" for="cardExpiry">Card Expiry (Year)</label>
                        <input type="text" id="cardExpiry" name="cardExpiry" class="text-input" />
                        <p class="input-error"></p>
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" class="text-input" />
                        <p class="input-error"></p>
                    </div>
                </div>

                <button class="submit-button" type="submit">COMPLETE PAYMENT</button>
            </section>
        </form>
    </main>
</body>

</html>
