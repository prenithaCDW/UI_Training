<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shruthi Bhatt-A product designer</title>
    <link rel="icon" href="./assets/favicon.ico">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <main>
        <!-- email -->
        <header class="email-section">
            <p class="email">shruthi.bhatt@siriuscom.com</p>
        </header>
        <!-- heading -->
        <section class="heading">
            <h1 class="name">Shruthi<span class="name-bold"> Bhatt</span></h1>
            <h3 class="occupation">a <span class="highlight-blue">product</span> designer</h3>
        </section>
        <!-- portfolio -->
        <section class="portfolio">
            <img src="./assets/products/rawpixel-769308-unsplash.png" class="portfolio-item" alt="rawpixel" />
            <img src="./assets/products/fancycrave-329196-unsplash.png" class="portfolio-item" alt="fancycrave" />
            <img src="./assets/products/nadine-shaabana-1112616-unsplash.png" class="portfolio-item"
                alt="nadineshaabana" />
            <img src="./assets/products/fikri-rasyid-689579-unsplash.png" class="portfolio-item" alt="fikrirasyid" />
            <img src="./assets/products/marc-mueller-654355-unsplash.png" class="portfolio-item" alt="marcmueller" />
            <img src="./assets/products/jeff-sheldon-3219-unsplash.png" class="portfolio-item" alt="jeffsheldon" />
        </section>
        <!-- brands -->
        <section class="brands-area">
            <h2>Big names to <span class="highlight-green">show off</span></h2>
            <div class="brands">
                <img src="./assets/logos/logo_1.png" class="brand-item" id="spotify" alt="spotify">
                <img src="./assets/logos/logo_3.png" class="brand-item" id="audi" alt="audi" />
                <img src="./assets/logos/logo_18.png" class="brand-item" id="adidas" alt="adidas" />
                <img src="./assets/logos/logo_7.png" class="brand-item" id="lufthansa" alt="lufthansa" />
                <img src="./assets/logos/logo_11.png" class="brand-item" id="ikea" alt="ikea" />
                <img src="./assets/logos/logo_2.png" class="brand-item" id="montblanc" alt="montblanc" />
            </div>
        </section>
        <!-- social media -->
        <footer class="footer">
            <div class="line">
                <span class="line-short"></span>
                <span class="line-long"></span>
            </div>
            <div class="social-media">
                <a href="https://www.facebook.com">
                    <i class="fab fa-facebook-f social-icons"></i>
                </a>
                <a href="https://www.twitter.com">
                    <i class="fab fa-twitter social-icons"></i>
                </a>
                <a href="https://www.instagram.com">
                    <i class="fab fa-instagram social-icons"></i>
                </a>
                <a href="https://www.dribbble.com">
                    <i class="fab fa-dribbble social-icons"></i>
                </a>
                <a href="#">
                    <i class="fa-brands social-icons">𝐌</i>
                </a>
            </div>
            <p class="footer-tag">
                Coded with Love & Passion
            </p>
        </footer>
    </main>
</body>

</html>
